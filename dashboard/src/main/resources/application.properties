server.port=8080

# ── Uploads ──────────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=16MB
spring.servlet.multipart.max-request-size=16MB

# ── PostgreSQL (overridden by env vars in Docker) ────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/satellite_dashboard}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:satellite}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=false

# ── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info

# ── JWT ──────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:super-secret-key-change-in-production-min-32-chars}
